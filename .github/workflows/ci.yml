name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The suite runs entirely against the committed snapshots, so CI never
      # depends on data.un.org being reachable.
      - name: Test
        run: npm test

      # Astro builds every page as static HTML; Pagefind then indexes them for search.
      - name: Build
        run: npm run build

      # The promises a reader can see: previews, privacy, old addresses, links.
      - name: Check the built site
        run: npm run test:site
